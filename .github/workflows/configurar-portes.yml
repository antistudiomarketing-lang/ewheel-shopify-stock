name: Configurar portes (manual)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "preview = só mostra; apply = aplica"
        type: choice
        options: [preview, apply]
        default: preview

permissions:
  contents: read

jobs:
  portes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Configurar portes
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          ARGS=""
          if [ "${{ inputs.modo }}" = "apply" ]; then ARGS="--aplicar"; fi
          python configurar_portes.py $ARGS
